<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#لوكل_آيز - تهنئة عيد الأضحى المبارك</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b1a17; /* خلفية داكنة مريحة للعين تبرز التصميم */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }
        /* كارت التهنئة الرئيسي */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 550px; /* حجم مثالي يتناسب مع كافة الشاشات وظهور التصميم كاملاً */
            aspect-ratio: 1 / 1;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            overflow: hidden;
            background-color: #fff;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* تعديل الاسم ليكون خطاً عادياً (Normal) وليس عريضاً (Bold) */
        .dynamic-name {
            position: absolute;
            bottom: 12%; 
            left: 21%;  
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: normal; /* تم تغييرها من bold إلى normal لخط ناعم وانسيابي */
            color: #1e4640; 
            text-align: center;
            white-space: nowrap;
            width: 35%;
        }
        /* صندوق الإدخال والتحميل العائم أسفل الشاشة */
        .floating-controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 480px;
        }
        .floating-controls input {
            flex-grow: 1;
            padding: 10px 16px;
            border: 1px solid #1e4640;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }
        .floating-controls input:focus {
            box-shadow: 0 0 0 2px rgba(30, 70, 64, 0.2);
        }
        /* زر التحميل التفاعلي */
        .download-btn {
            background-color: #1e4640;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .download-btn:hover {
            background-color: #14302c;
            transform: translateY(-1px);
        }
        .download-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        /* تحسينات الشاشات الصغيرة */
        @media (max-width: 480px) {
            .floating-controls {
                flex-direction: column;
                border-radius: 20px;
                bottom: 15px;
                padding: 15px;
            }
            .floating-controls input, .download-btn {
                width: 100%;
            }
            .dynamic-name {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container" id="greetingCard">
        <img src="background.jpg" alt="Eid Greeting" class="bg-image">
        <div class="dynamic-name" id="userName">اسمك هنا</div>
    </div>

    <div class="floating-controls" id="controlsBox">
        <input type="text" id="nameInput" placeholder="اكتب اسمك هنا للتهنئة..." maxlength="30">
        <button class="download-btn" id="downloadBtn">تحميل التهنئة PNG</button>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const userName = document.getElementById('userName');
        const downloadBtn = document.getElementById('downloadBtn');
        const greetingCard = document.getElementById('greetingCard');

        nameInput.addEventListener('input', (e) => {
            if(e.target.value.trim() !== "") {
                userName.textContent = e.target.value;
            } else {
                userName.textContent = "اسمك هنا";
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        if (nameParam) {
            userName.textContent = nameParam;
            nameInput.value = nameParam;
        }

        downloadBtn.addEventListener('click', () => {
            const originalBtnText = downloadBtn.textContent;
            downloadBtn.textContent = "جاري الحفظ...";
            downloadBtn.disabled = true;

            const currentName = nameInput.value.trim() || "تهنئة";
            const fileName = `LocalEyes_${currentName}.png`;

            html2canvas(greetingCard, {
                useCORS: true, 
                scale: 2, 
                logging: false,
                backgroundColor: null 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();

                downloadBtn.textContent = originalBtnText;
                downloadBtn.disabled = false;
            }).catch(err => {
                alert("حدث خطأ أثناء إعداد الصورة، يرجى المحاولة مرة أخرى.");
                downloadBtn.textContent = originalBtnText;
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
