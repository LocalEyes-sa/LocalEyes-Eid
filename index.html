<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة عيد الأضحى - LocalEyes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .card-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
        }
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .dynamic-name {
            position: absolute;
            bottom: 12%; 
            right: 12%;  
            font-size: 24px;
            font-weight: bold;
            color: #1e4640; 
            text-align: right;
            white-space: nowrap;
        }
        .input-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .input-overlay input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        @media print {
            .input-overlay { display: none; }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <img src="20262305_LocalEyes_Ead-Aladha_Greeting_V1_1030_For Review -01.jpg" alt="Eid Greeting" class="bg-image">
        
        <div class="dynamic-name" id="userName">اسمك هنا</div>

        <div class="input-overlay" id="inputBox">
            <input type="text" id="nameInput" placeholder="اكتب اسمك هنا..." maxlength="30">
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const userName = document.getElementById('userName');

        nameInput.addEventListener('input', (e) => {
            if(e.target.value.trim() !== "") {
                userName.textContent = e.target.value;
            } else {
                userName.textContent = "اسمك هنا";
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        if (nameParam) {
            userName.textContent = nameParam;
            nameInput.value = nameParam;
        }
    </script>
</body>
</html>
